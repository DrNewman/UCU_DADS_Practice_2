version: '3.8'

networks:
  raft-net:
    driver: bridge

services:
  node1:
    build:
      context: ./raft-node
      dockerfile: Dockerfile
    container_name: raft-node-1
    ports:
      - "8081:8080"
    environment:
      - RAFT_NODE_ID=node1
      - RAFT_PEERS=http://node2:8080,http://node3:8080
    networks:
      - raft-net

  node2:
    build:
      context: ./raft-node
      dockerfile: Dockerfile
    container_name: raft-node-2
    ports:
      - "8082:8080"
    environment:
      - RAFT_NODE_ID=node2
      - RAFT_PEERS=http://node1:8080,http://node3:8080
    networks:
      - raft-net

  node3:
    build:
      context: ./raft-node
      dockerfile: Dockerfile
    container_name: raft-node-3
    ports:
      - "8083:8080"
    environment:
      - RAFT_NODE_ID=node3
      - RAFT_PEERS=http://node1:8080,http://node2:8080
    networks:
      - raft-net